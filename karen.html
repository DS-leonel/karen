<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Leonel ❤ Karen</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#0b1220;
      --accent:#ff4d6d;
      --accent-2:#ffd166;
      --mono: 'Courier New', monospace;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family: 'Segoe UI', sans-serif;}
    body{
      background: linear-gradient(160deg,var(--bg1),var(--bg2));
      color:#fff;
      display:flex;align-items:center;justify-content:center;
      padding:20px;overflow:hidden;
    }

    .card{
      width:min(820px,95%);
      background: rgba(255,255,255,0.05);
      border-radius:20px;
      padding:28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      text-align:center;
      position:relative;
    }

    h1{
      font-size: clamp(28px,6vw,46px);
      margin:0 0 12px 0;
    }
    .subtitle{
      font-size:18px;
      opacity:0.85;
      margin-bottom:20px;
    }

    .typewriter{
      font-family: var(--mono);
      font-size:20px;
      background: linear-gradient(90deg,var(--accent),var(--accent-2));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      display:inline-block;
      white-space:nowrap;
      overflow:hidden;
    }

    .heart{
      position:absolute;width:22px;height:22px;
      transform:translate(-50%,-50%);
      background:var(--accent);
      clip-path:path('M10 3 C12 0 18 0 18 6 C18 12 10 16 10 16 C10 16 2 12 2 6 C2 0 8 0 10 3 Z');
      opacity:0.95;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp{
      0%{transform: translateY(60vh) scale(0.7) rotate(0);} 
      50%{transform: translateY(30vh) scale(1.2) rotate(10deg);} 
      100%{transform: translateY(-20vh) scale(0.8) rotate(-8deg); opacity:0}
    }

    button{
      cursor:pointer;padding:12px 18px;border-radius:12px;border:none;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      color:#071028;font-weight:600;font-size:16px;
      box-shadow:0 6px 14px rgba(0,0,0,0.4);
      margin-top:20px;
    }

    footer{font-size:14px;color:rgba(255,255,255,0.7);margin-top:18px}

  </style>
</head>
<body>
  <div class="card">
    <h1>Para ti, Karen ❤️</h1>
    <div class="subtitle">De tu Leonel, con todo mi amor.</div>

    <div style="margin-bottom:16px">
      <span class="typewriter" id="type"></span>
    </div>

    <button id="loveBtn">Haz clic para descubrir mi amor ✨</button>

    <footer>Leonel & Karen — unidos por siempre 💞<br><small>Tip: agita tu celular para más corazones 💓</small></footer>

    <div id="hearts"></div>
  </div>

  <canvas id="confettiCanvas" style="position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:40"></canvas>

  <script>
    // mensajes románticos personalizados
    const messages = [
      "Karen, eres el mejor código que la vida escribió en mi corazón.",
      "Si la vida fuera un programa, tú serías mi función favorita.",
      "Prometo amarte en cada versión, sin importar los bugs.",
      "Te amo más que a cualquier commit perfecto. ❤"
    ];
    const typeEl = document.getElementById('type');
    let msgIndex = 0;

    function typeMessage(txt, el, speed=50){
      el.textContent = '';
      let i=0;
      const t = setInterval(()=>{
        el.textContent += txt[i++]||'';
        if(i>txt.length){ clearInterval(t); }
      }, speed);
    }
    typeMessage(messages[msgIndex], typeEl);
    setInterval(()=>{
      msgIndex = (msgIndex+1)%messages.length;
      typeMessage(messages[msgIndex], typeEl);
    },7000);

    // corazones flotantes
    const heartsContainer = document.getElementById('hearts');
    function spawnHeart(){
      const el = document.createElement('div');
      el.className = 'heart';
      const size = 16 + Math.random()*30;
      el.style.width = size+'px'; el.style.height = size+'px';
      el.style.left = Math.random()*100+'%';
      el.style.bottom = '-10vh';
      el.style.animationDuration = (6 + Math.random()*6)+'s';
      heartsContainer.appendChild(el);
      setTimeout(()=>el.remove(),12000);
    }
    setInterval(()=>spawnHeart(),1000);

    // confetti
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = innerWidth; let H = canvas.height = innerHeight;
    window.addEventListener('resize', ()=>{ W=canvas.width=innerWidth; H=canvas.height=innerHeight; });

    let confettis = [];
    function Confetti(){
      this.x = Math.random()*W; this.y = -10 - Math.random()*100; this.r = 6+Math.random()*8;
      this.color = ['#ff4d6d','#ffd166','#9ee493','#7ad7ff'][Math.floor(Math.random()*4)];
      this.speed = 1+Math.random()*4;
    }
    Confetti.prototype.update = function(){ this.y += this.speed; }
    Confetti.prototype.draw = function(){ ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fillStyle=this.color; ctx.fill(); }
    function addConfetti(n=40){ for(let i=0;i<n;i++) confettis.push(new Confetti()); }
    function confettiLoop(){ ctx.clearRect(0,0,W,H); for(let i=confettis.length-1;i>=0;i--){ const p=confettis[i]; p.update(); p.draw(); if(p.y>H+50) confettis.splice(i,1); } requestAnimationFrame(confettiLoop); }
    confettiLoop();

    // botón de amor
    document.getElementById('loveBtn').addEventListener('click', ()=>{
      for(let i=0;i<40;i++){ setTimeout(()=>spawnHeart(), i*30); }
      addConfetti(120);
      alert("Karen ❤ Leonel — nuestro amor es infinito... como los decimales de π: 3.141592653589793238...");
;
    });

    // detectar agitar celular
    if('DeviceMotionEvent' in window){
      let last = {x:0,y:0,z:0};
      window.addEventListener('devicemotion', (ev)=>{
        const a = ev.accelerationIncludingGravity;
        if(!a) return;
        const dx = Math.abs(a.x - last.x);
        const dy = Math.abs(a.y - last.y);
        const dz = Math.abs(a.z - last.z);
        if(dx+dy+dz>25){
          for(let i=0;i<30;i++) setTimeout(()=>spawnHeart(), i*40);
          addConfetti(80);
        }
        last = {x:a.x,y:a.y,z:a.z};
      });
    }

  </script>
</body>
</html>
